services:
  postgres:
    image: postgres:16-alpine
    container_name: observatorio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: observatorio_uleam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: post123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
