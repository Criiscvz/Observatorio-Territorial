<section class="atlas-directory" aria-labelledby="barometro-heading">
  @if (section(); as current) {
    <header class="atlas-library-heading">
      <span class="category-icon" aria-hidden="true"><mat-icon>{{current.icon}}</mat-icon></span>
      <div><p class="eyebrow">Barómetro</p><h1 id="barometro-heading">{{current.name}}</h1><p>{{current.description}}</p></div>
    </header>
    <app-public-link-library kind="barometro" [items]="items()" [query]="query()" [page]="page()"
      [total]="total()" [loading]="loading()" [failed]="failed()" (search)="search($event)"
      (pageChange)="changePage($event)" (retry)="reload()" (read)="open($event)" (details)="open($event, true)" />
  } @else {
    <div class="directory-empty">
      <h1 id="barometro-heading">Sección del Barómetro no disponible</h1>
      <a class="public-button" routerLink="/publico/barometro/barometro">Ir a Barómetro ULEAM</a>
    </div>
  }
</section>
