worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 24m;

        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        # PHP runs in its own container. Never evaluate a client-selected PHP path.
        location ~ ^/(api|sanctum|storage)(/|$) {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass api:9000;
            fastcgi_hide_header X-Powered-By;
            add_header X-Content-Type-Options "nosniff" always;
            fastcgi_read_timeout 60s;
            fastcgi_buffering off;
        }
        location ~ /\. { return 404; }
        location ~ \.php$ { return 404; }
        location = /index.html {
            include /etc/nginx/portable-headers.conf;
            add_header Cache-Control "no-store" always;
        }
        location = /index.csr.html {
            include /etc/nginx/portable-headers.conf;
            add_header Cache-Control "no-store" always;
        }
        location = /ngsw.json {
            include /etc/nginx/portable-headers.conf;
            add_header Cache-Control "no-store" always;
        }
        location = /ngsw-worker.js {
            include /etc/nginx/portable-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
        # PDF.js is an ES module worker; nosniff requires a JavaScript MIME type.
        location ~ \.mjs$ {
            types { text/javascript mjs; }
            include /etc/nginx/portable-headers.conf;
            try_files $uri =404;
        }
        location ~ \.[a-zA-Z0-9]+$ {
            include /etc/nginx/portable-headers.conf;
            try_files $uri =404;
        }
        location / {
            include /etc/nginx/portable-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
