[www]
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; Structured application logs replace request access lines (which include private URLs).
access.log = /dev/null
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
